name: Kessik
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  # Pinned: 0.12.1 moved NIOSSH to a third-party fork. 0.12.0 uses the maintainer's fork.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.0
  # Same package Citadel 0.12.0 uses, declared so the app can import NIOSSH for host key checks.
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh
    minorVersion: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  # The small repo that points at Lottie's prebuilt XCFramework.
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.6.1
targets:
  Kessik:
    type: application
    platform: iOS
    sources: [Kessik]
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SSHTERM_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Holds only the launch screen; Xcode adds the INFOPLIST_KEY_ values below to it.
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kessik
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Kessik connects to computers on your local network over SSH.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  KessikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KessikTests]
    dependencies:
      - target: Kessik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SSHTERM_BUNDLE_ID).tests
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kessik.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kessik
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Kessik:
    build:
      targets:
        Kessik: all
    test:
      targets: [KessikTests]
